<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Control PAE</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f2f4f7;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
    }

    .contenedor {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 18px;
    }

    .titulo {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .subtitulo {
      text-align: center;
      font-size: 15px;
      color: #666;
      margin-bottom: 20px;
    }

    .servicio {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .servicio label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 13px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
    }

    #reader {
      width: 100%;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .estado {
      text-align: center;
      font-size: 15px;
      color: #666;
      margin: 10px 0;
      min-height: 22px;
    }

    .resultado {
      display: none;
      background: white;
      border-radius: 14px;
      padding: 22px 18px;
      margin-top: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
      text-align: center;
    }

    .resultado-titulo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .resultado-nombre {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.3;
    }

    .resultado-dato {
      font-size: 17px;
      margin: 8px 0;
      line-height: 1.4;
    }

    .resultado-dato strong {
      font-weight: bold;
    }

    .siguiente {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #1976d2;
      color: white;
    }

    .siguiente:active {
      transform: scale(0.98);
    }

    .oculto {
      display: none !important;
    }

    .error {
      color: #b00020;
    }

  </style>

</head>


<body>

  <div class="contenedor">

    <div class="titulo">
      CONTROL PAE
    </div>

    <div class="subtitulo">
      Liceo Industrial Benjamín Franklin
    </div>


    <div
      class="servicio"
      id="bloqueServicio"
    >

      <label for="servicio">
        Servicio
      </label>

      <select id="servicio">

        <option value="DESAYUNO">
          DESAYUNO
        </option>

        <option value="ALMUERZO">
          ALMUERZO
        </option>

      </select>

    </div>


    <div id="lector">

      <div id="reader"></div>

      <div
        id="estado"
        class="estado"
      >
        Iniciando cámara...
      </div>

    </div>


    <div
      id="resultado"
      class="resultado"
    >

      <div
        id="resultadoTitulo"
        class="resultado-titulo"
      ></div>

      <div
        id="resultadoNombre"
        class="resultado-nombre"
      ></div>

      <div
        id="resultadoServicio"
        class="resultado-dato"
      ></div>

      <div
        id="resultadoFecha"
        class="resultado-dato"
      ></div>

      <div
        id="resultadoHora"
        class="resultado-dato"
      ></div>

      <button
        id="btnSiguiente"
        class="siguiente"
        onclick="siguiente()"
      >
        ➡️ SIGUIENTE
      </button>

    </div>

  </div>


  <script>

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbxPnTIJWHBdZuflY6QJFPqnJjLL2UrY1BOafTNhVOrHo3WuDXh5d3AU8Qe0NsMkhMKY/exec";


    let html5QrCode = null;

    /*
     * Esta variable es fundamental.
     *
     * Mientras sea true:
     *
     * - no se acepta otra lectura;
     * - no se envía otra petición;
     * - aunque la cámara entregue otro evento,
     *   será ignorado.
     */
    let procesando = false;


    /*
     * Identificador de la petición actual.
     *
     * Sirve para asegurarnos de que una respuesta
     * antigua no pueda modificar una lectura nueva.
     */
    let idPeticionActual = 0;


    /*
     * Indica si ya recibimos la respuesta
     * del servidor.
     */
    let respuestaRecibida = false;



    /************************************************************
     * INICIAR ESCÁNER
     ************************************************************/

    function iniciarEscaner() {

      procesando = false;
      respuestaRecibida = false;

      document
        .getElementById("resultado")
        .style.display = "none";

      document
        .getElementById("lector")
        .classList.remove("oculto");

      document
        .getElementById("bloqueServicio")
        .classList.remove("oculto");

      document
        .getElementById("estado")
        .textContent =
          "Apunta la cámara al código PAE.";


      /*
       * Si existía una instancia anterior,
       * intentamos limpiarla antes de crear otra.
       */

      if (html5QrCode) {

        try {
          html5QrCode.clear();
        } catch (e) {}

        html5QrCode = null;
      }


      html5QrCode =
        new Html5Qrcode("reader");


      const config = {

        fps: 10,

        qrbox:
          function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const size =
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.70;

            return {
              width: size,
              height: size
            };

          },

        aspectRatio: 1.0

      };


      html5QrCode.start(

        {
          facingMode: {
            exact: "environment"
          }
        },

        config,

        onScanSuccess,

        onScanFailure

      )
      .catch(function(error) {

        console.error(
          "Error cámara:",
          error
        );

        iniciarCamaraAlternativa();

      });

    }



    /************************************************************
     * CÁMARA ALTERNATIVA
     ************************************************************/

    function iniciarCamaraAlternativa() {

      if (html5QrCode) {

        try {
          html5QrCode.clear();
        } catch (e) {}

      }

      html5QrCode =
        new Html5Qrcode("reader");


      const config = {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      };


      html5QrCode.start(

        {
          facingMode: "environment"
        },

        config,

        onScanSuccess,

        onScanFailure

      )
      .catch(function(error) {

        console.error(error);

        document
          .getElementById("estado")
          .innerHTML =
            '<span class="error">' +
            'No se pudo iniciar la cámara.' +
            '</span>';

      });

    }



    /************************************************************
     * LECTURA DEL CÓDIGO
     ************************************************************/

    function onScanSuccess(decodedText) {

      /*
       * ESTA ES LA PRIMERA BARRERA.
       *
       * Si ya existe una lectura procesándose,
       * ignoramos completamente cualquier nueva lectura.
       */

      if (procesando) {

        console.log(
          "Lectura ignorada: ya existe una petición en curso."
        );

        return;
      }


      /*
       * Bloqueamos INMEDIATAMENTE.
       *
       * Esto ocurre antes de detener la cámara,
       * antes de enviar la petición y antes de cualquier
       * operación que pueda demorar.
       */

      procesando = true;

      respuestaRecibida = false;


      /*
       * Generamos un identificador único para esta lectura.
       */

      idPeticionActual++;

      const miPeticion =
        idPeticionActual;


      const codigo =
        String(
          decodedText || ""
        )
          .trim()
          .toUpperCase();


      const servicio =
        document
          .getElementById("servicio")
          .value;


      console.log(
        "Código detectado:",
        codigo
      );

      console.log(
        "Servicio:",
        servicio
      );


      /*
       * OCULTAMOS EL LECTOR INMEDIATAMENTE.
       *
       * No esperamos a que html5-qrcode
       * termine de detener la cámara.
       */

      document
        .getElementById("lector")
        .classList.add("oculto");


      document
        .getElementById("bloqueServicio")
        .classList.add("oculto");


      /*
       * Mostramos inmediatamente que estamos
       * esperando la respuesta.
       */

      mostrarEsperando();


      /*
       * Detenemos la cámara.
       *
       * PERO NO esperamos este proceso para
       * enviar la petición.
       */

      detenerCamara();


      /*
       * Enviamos UNA sola petición.
       */

      enviarRegistro(
        codigo,
        servicio,
        miPeticion
      );

    }



    /************************************************************
     * FALLA DE LECTURA
     ************************************************************/

    function onScanFailure(error) {

      /*
       * No hacemos nada.
       *
       * Las fallas normales de lectura de cámara
       * son ignoradas.
       */

    }



    /************************************************************
     * DETENER CÁMARA
     ************************************************************/

    function detenerCamara() {

      if (!html5QrCode) {
        return;
      }


      try {

        const resultado =
          html5QrCode.stop();


        /*
         * NO usamos await.
         *
         * La interfaz ya fue bloqueada y ocultada.
         * La petición al servidor no depende de que
         * la cámara termine de detenerse.
         */

        if (
          resultado &&
          typeof resultado.then === "function"
        ) {

          resultado
            .then(function() {

              console.log(
                "Cámara detenida."
              );

            })
            .catch(function(error) {

              console.log(
                "La cámara ya estaba detenida.",
                error
              );

            });

        }

      } catch (error) {

        console.log(
          "Error al detener cámara:",
          error
        );

      }

    }



    /************************************************************
     * MOSTRAR "REGISTRANDO..."
     ************************************************************/

    function mostrarEsperando() {

      const resultado =
        document.getElementById(
          "resultado"
        );


      resultado.style.display =
        "block";


      document
        .getElementById(
          "resultadoTitulo"
        )
        .textContent =
          "⏳ REGISTRANDO...";


      document
        .getElementById(
          "resultadoNombre"
        )
        .textContent =
          "Procesando el registro.";


      document
        .getElementById(
          "resultadoServicio"
        )
        .innerHTML = "";


      document
        .getElementById(
          "resultadoFecha"
        )
        .innerHTML = "";


      document
        .getElementById(
          "resultadoHora"
        )
        .innerHTML = "";


      /*
       * Mientras esperamos la respuesta,
       * ocultamos SIGUIENTE.
       */

      document
        .getElementById(
          "btnSiguiente"
        )
        .classList.add("oculto");

    }



    /************************************************************
     * ENVIAR REGISTRO
     ************************************************************/

    function enviarRegistro(
      codigo,
      servicio,
      miPeticion
    ) {

      /*
       * Nombre único para JSONP.
       */

      const callbackName =
        "respuestaPAE_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      let script = null;


      /*
       * CALLBACK DEL SERVIDOR
       */

      window[callbackName] =
        function(respuesta) {

          /*
           * Si esta respuesta corresponde
           * a una petición antigua, la ignoramos.
           */

          if (
            miPeticion !==
            idPeticionActual
          ) {

            console.log(
              "Respuesta antigua ignorada."
            );

            return;
          }


          /*
           * Marcamos que la respuesta llegó.
           */

          respuestaRecibida =
            true;


          /*
           * Eliminamos inmediatamente
           * el callback global.
           */

          try {

            delete window[
              callbackName
            ];

          } catch (e) {

            window[
              callbackName
            ] = undefined;

          }


          /*
           * Eliminamos el script
           * que realizó la petición.
           */

          if (
            script &&
            script.parentNode
          ) {

            script.parentNode
              .removeChild(script);

          }


          /*
           * Mostramos el resultado.
           */

          mostrarResultado(
            respuesta
          );


          /*
           * SOLO AHORA permitimos
           * pasar a la siguiente lectura.
           */

          document
            .getElementById(
              "btnSiguiente"
            )
            .classList.remove("oculto");

        };


      /*
       * Construimos la URL.
       */

      const url =
        URL_APPS_SCRIPT +
        "?codigo=" +
        encodeURIComponent(codigo) +
        "&servicio=" +
        encodeURIComponent(servicio) +
        "&callback=" +
        encodeURIComponent(callbackName);


      /*
       * Creamos el script JSONP.
       */

      script =
        document.createElement(
          "script"
        );


      script.src = url;


      /*
       * Si falla la comunicación,
       * mostramos error y permitimos
       * volver a intentar.
       */

      script.onerror =
        function() {

          /*
           * Si ya llegó una respuesta,
           * no hacemos nada.
           */

          if (respuestaRecibida) {
            return;
          }


          try {

            delete window[
              callbackName
            ];

          } catch (e) {

            window[
              callbackName
            ] = undefined;

          }


          if (
            script &&
            script.parentNode
          ) {

            script.parentNode
              .removeChild(script);

          }


          mostrarError(
            "No fue posible comunicarse con el sistema."
          );

        };


      /*
       * MUY IMPORTANTE:
       *
       * El script se agrega DESPUÉS de haber
       * bloqueado la interfaz.
       */

      document.body.appendChild(
        script
      );

    }



    /************************************************************
     * MOSTRAR RESULTADO
     ************************************************************/

    function mostrarResultado(
      respuesta
    ) {

      const resultado =
        document.getElementById(
          "resultado"
        );


      resultado.style.display =
        "block";


      const titulo =
        document.getElementById(
          "resultadoTitulo"
        );


      const nombre =
        document.getElementById(
          "resultadoNombre"
        );


      const servicio =
        document.getElementById(
          "resultadoServicio"
        );


      const fecha =
        document.getElementById(
          "resultadoFecha"
        );


      const hora =
        document.getElementById(
          "resultadoHora"
        );


      /*
       * Limpiamos contenido anterior.
       */

      servicio.innerHTML = "";
      fecha.innerHTML = "";
      hora.innerHTML = "";


      /*
       * ERROR GENERAL
       */

      if (
        !respuesta ||
        (
          respuesta.ok === false &&
          !respuesta.duplicado
        )
      ) {

        titulo.textContent =
          respuesta &&
          respuesta.titulo
            ? respuesta.titulo
            : "❌ ERROR";


        nombre.textContent =
          respuesta &&
          respuesta.mensaje
            ? respuesta.mensaje
            : "No fue posible registrar.";


        return;
      }


      /*
       * DUPLICADO
       */

      if (
        respuesta.duplicado === true
      ) {

        titulo.textContent =
          "⚠️ ESTUDIANTE YA REGISTRADO";


        nombre.textContent =
          respuesta.estudiante ||
          respuesta.mensaje ||
          "";


        servicio.innerHTML =
          "<strong>Servicio:</strong> " +
          escaparHtml(
            respuesta.servicio || ""
          );


        fecha.innerHTML =
          "<strong>Fecha:</strong> " +
          escaparHtml(
            respuesta.fecha || ""
          );


        hora.innerHTML =
          "<strong>Hora del registro:</strong> " +
          escaparHtml(
            respuesta.hora || ""
          );


        return;
      }


      /*
       * REGISTRO CORRECTO
       */

      titulo.textContent =
        "✅ ESTUDIANTE REGISTRADO";


      nombre.textContent =
        respuesta.estudiante ||
        respuesta.mensaje ||
        "";


      servicio.innerHTML =
        "<strong>Servicio:</strong> " +
        escaparHtml(
          respuesta.servicio || ""
        );


      fecha.innerHTML =
        "<strong>Fecha:</strong> " +
        escaparHtml(
          respuesta.fecha || ""
        );


      hora.innerHTML =
        "<strong>Hora:</strong> " +
        escaparHtml(
          respuesta.hora || ""
        );

    }



    /************************************************************
     * ERROR
     ************************************************************/

    function mostrarError(
      mensaje
    ) {

      respuestaRecibida =
        false;


      document
        .getElementById(
          "resultado"
        )
        .style.display =
          "block";


      document
        .getElementById(
          "resultadoTitulo"
        )
        .textContent =
          "❌ ERROR";


      document
        .getElementById(
          "resultadoNombre"
        )
        .textContent =
          mensaje;


      document
        .getElementById(
          "resultadoServicio"
        )
        .innerHTML = "";


      document
        .getElementById(
          "resultadoFecha"
        )
        .innerHTML = "";


      document
        .getElementById(
          "resultadoHora"
        )
        .innerHTML = "";


      /*
       * Permite volver a intentar.
       */

      document
        .getElementById(
          "btnSiguiente"
        )
        .classList.remove("oculto");

    }



    /************************************************************
     * SIGUIENTE
     ************************************************************/

    function siguiente() {

      /*
       * Solo permitimos continuar
       * cuando la petición anterior terminó.
       */

      if (
        !respuestaRecibida
      ) {

        console.log(
          "SIGUIENTE bloqueado: todavía esperando respuesta."
        );

        return;
      }


      /*
       * Ocultamos resultado.
       */

      document
        .getElementById(
          "resultado"
        )
        .style.display =
          "none";


      /*
       * Mostramos nuevamente servicio
       * y lector.
       */

      document
        .getElementById(
          "bloqueServicio"
        )
        .classList.remove(
          "oculto"
        );


      document
        .getElementById(
          "lector"
        )
        .classList.remove(
          "oculto"
        );


      document
        .getElementById(
          "estado"
        )
        .textContent =
          "Iniciando cámara...";


      /*
       * Liberamos la lectura anterior.
       */

      procesando = false;

      respuestaRecibida = false;


      /*
       * Pequeña pausa para asegurar
       * que la instancia anterior de la cámara
       * haya terminado completamente.
       */

      setTimeout(
        function() {

          iniciarEscaner();

        },
        300
      );

    }



    /************************************************************
     * ESCAPAR HTML
     ************************************************************/

    function escaparHtml(
      texto
    ) {

      return String(
        texto || ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }



    /************************************************************
     * INICIO
     ************************************************************/

    window.addEventListener(
      "load",
      function() {

        iniciarEscaner();

      }
    );

  </script>

</body>

</html>
