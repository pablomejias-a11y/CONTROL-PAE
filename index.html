<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Control PAE</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f2f4f7;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
    }

    .contenedor {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 18px;
    }

    .titulo {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .subtitulo {
      text-align: center;
      font-size: 15px;
      color: #666;
      margin-bottom: 20px;
    }

    .servicio {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .servicio label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 13px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
    }

    #reader {
      width: 100%;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .estado {
      text-align: center;
      font-size: 15px;
      color: #666;
      margin: 10px 0;
      min-height: 22px;
    }

    .resultado {
      display: none;
      background: white;
      border: 2px solid #ccc;
      border-radius: 14px;
      padding: 22px 18px;
      margin-top: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
      text-align: center;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    /* ==============================
       COLORES DE RESULTADO
       ============================== */

    .resultado-exito {
      background: #b7e1cd;
      border: 2px solid #6aa84f;
    }

    .resultado-duplicado {
      background: #fff2cc;
      border: 2px solid #d6b656;
    }

    .resultado-no-beneficiario {
      background: #f4c7c3;
      border: 2px solid #cc0000;
    }

    .resultado-error {
      background: white;
      border: 2px solid #ccc;
    }

    .resultado-exito .resultado-titulo {
      color: #006100;
    }

    .resultado-duplicado .resultado-titulo {
      color: #7f6000;
    }

    .resultado-no-beneficiario .resultado-titulo {
      color: #9c0006;
    }

    .resultado-error .resultado-titulo {
      color: #b00020;
    }

    .resultado-titulo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .resultado-nombre {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.3;
    }

    .resultado-dato {
      font-size: 17px;
      margin: 8px 0;
      line-height: 1.4;
    }

    .resultado-dato strong {
      font-weight: bold;
    }

    .siguiente {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #1976d2;
      color: white;
    }

    .siguiente:active {
      transform: scale(0.98);
    }

    .oculto {
      display: none !important;
    }

    .error {
      color: #b00020;
    }

  </style>

</head>


<body>

  <div class="contenedor">

    <div class="titulo">
      CONTROL PAE
    </div>

    <div class="subtitulo">
      Liceo Industrial Benjamín Franklin
    </div>


    <div
      class="servicio"
      id="bloqueServicio"
    >

      <label for="servicio">
        Servicio
      </label>

      <select id="servicio">

        <option value="DESAYUNO">
          DESAYUNO
        </option>

        <option value="ALMUERZO">
          ALMUERZO
        </option>

      </select>

    </div>


    <div id="lector">

      <div id="reader"></div>

      <div
        id="estado"
        class="estado"
      >
        Iniciando cámara...
      </div>

    </div>


    <div
      id="resultado"
      class="resultado"
    >

      <div
        id="resultadoTitulo"
        class="resultado-titulo"
      ></div>

      <div
        id="resultadoNombre"
        class="resultado-nombre"
      ></div>

      <div
        id="resultadoServicio"
        class="resultado-dato"
      ></div>

      <div
        id="resultadoFecha"
        class="resultado-dato"
      ></div>

      <div
        id="resultadoHora"
        class="resultado-dato"
      ></div>

      <button
        id="btnSiguiente"
        class="siguiente"
        onclick="siguiente()"
      >
        ➡️ SIGUIENTE
      </button>

    </div>

  </div>


  <script>

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbxPnTIJWHBdZuflY6QJFPqnJjLL2UrY1BOafTNhVOrHo3WuDXh5d3AU8Qe0NsMkhMKY/exec";


    let html5QrCode = null;

    let procesando = false;

    let idPeticionActual = 0;

    let respuestaRecibida = false;


    /************************************************************
     * INICIAR ESCÁNER
     ************************************************************/

    function iniciarEscaner() {

      procesando = false;
      respuestaRecibida = false;

      document
        .getElementById("resultado")
        .style.display = "none";

      document
        .getElementById("resultado")
        .className = "resultado";

      document
        .getElementById("lector")
        .classList.remove("oculto");

      document
        .getElementById("bloqueServicio")
        .classList.remove("oculto");

      document
        .getElementById("estado")
        .textContent =
          "Apunta la cámara al código PAE.";


      if (html5QrCode) {

        try {
          html5QrCode.clear();
        } catch (e) {}

        html5QrCode = null;
      }


      html5QrCode =
        new Html5Qrcode("reader");


      const config = {

        fps: 10,

        qrbox:
          function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const size =
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.70;

            return {
              width: size,
              height: size
            };

          },

        aspectRatio: 1.0

      };


      html5QrCode.start(

        {
          facingMode: {
            exact: "environment"
          }
        },

        config,

        onScanSuccess,

        onScanFailure

      )
      .catch(function(error) {

        console.error(
          "Error cámara:",
          error
        );

        iniciarCamaraAlternativa();

      });

    }


    /************************************************************
     * CÁMARA ALTERNATIVA
     ************************************************************/

    function iniciarCamaraAlternativa() {

      if (html5QrCode) {

        try {
          html5QrCode.clear();
        } catch (e) {}

      }

      html5QrCode =
        new Html5Qrcode("reader");


      const config = {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      };


      html5QrCode.start(

        {
          facingMode: "environment"
        },

        config,

        onScanSuccess,

        onScanFailure

      )
      .catch(function(error) {

        console.error(error);

        document
          .getElementById("estado")
          .innerHTML =
            '<span class="error">' +
            'No se pudo iniciar la cámara.' +
            '</span>';

      });

    }


    /************************************************************
     * LECTURA DEL CÓDIGO
     ************************************************************/

    function onScanSuccess(decodedText) {

      if (procesando) {

        console.log(
          "Lectura ignorada: ya existe una petición en curso."
        );

        return;
      }


      procesando = true;

      respuestaRecibida = false;

      idPeticionActual++;

      const miPeticion =
        idPeticionActual;


      const codigo =
        String(
          decodedText || ""
        )
          .trim()
          .toUpperCase();


      const servicio =
        document
          .getElementById("servicio")
          .value;


      console.log(
        "Código detectado:",
        codigo
      );

      console.log(
        "Servicio:",
        servicio
      );


      /*
       * Ocultamos inmediatamente la cámara.
       */

      document
        .getElementById("lector")
        .classList.add("oculto");


      document
        .getElementById("bloqueServicio")
        .classList.add("oculto");


      /*
       * Mostramos inmediatamente el estado.
       */

      mostrarEsperando();


      /*
       * Detenemos la cámara,
       * pero NO esperamos a que termine.
       */

      detenerCamara();


      /*
       * Enviamos el registro.
       */

      enviarRegistro(
        codigo,
        servicio,
        miPeticion
      );

    }


    /************************************************************
     * FALLA DE LECTURA
     ************************************************************/

    function onScanFailure(error) {

    }


    /************************************************************
     * DETENER CÁMARA
     ************************************************************/

    function detenerCamara() {

      if (!html5QrCode) {
        return;
      }


      try {

        const resultado =
          html5QrCode.stop();


        if (
          resultado &&
          typeof resultado.then === "function"
        ) {

          resultado
            .then(function() {

              console.log(
                "Cámara detenida."
              );

            })
            .catch(function(error) {

              console.log(
                "La cámara ya estaba detenida.",
                error
              );

            });

        }

      } catch (error) {

        console.log(
          "Error al detener cámara:",
          error
        );

      }

    }


    /************************************************************
     * MOSTRAR ESPERA
     ************************************************************/

    function mostrarEsperando() {

      const resultado =
        document.getElementById(
          "resultado"
        );


      resultado.className =
        "resultado resultado-error";


      resultado.style.display =
        "block";


      document
        .getElementById(
          "resultadoTitulo"
        )
        .textContent =
          "⏳ REGISTRANDO...";


      document
        .getElementById(
          "resultadoNombre"
        )
        .textContent =
          "Procesando el registro.";


      document
        .getElementById(
          "resultadoServicio"
        )
        .innerHTML = "";


      document
        .getElementById(
          "resultadoFecha"
        )
        .innerHTML = "";


      document
        .getElementById(
          "resultadoHora"
        )
        .innerHTML = "";


      document
        .getElementById(
          "btnSiguiente"
        )
        .classList.add("oculto");

    }


    /************************************************************
     * ENVIAR REGISTRO
     ************************************************************/

    function enviarRegistro(
      codigo,
      servicio,
      miPeticion
    ) {

      const callbackName =
        "respuestaPAE_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      let script = null;


      window[callbackName] =
        function(respuesta) {

          if (
            miPeticion !==
            idPeticionActual
          ) {

            console.log(
              "Respuesta antigua ignorada."
            );

            return;
          }


          respuestaRecibida =
            true;


          try {

            delete window[
              callbackName
            ];

          } catch (e) {

            window[
              callbackName
            ] = undefined;

          }


          if (
            script &&
            script.parentNode
          ) {

            script.parentNode
              .removeChild(script);

          }


          mostrarResultado(
            respuesta
          );


          document
            .getElementById(
              "btnSiguiente"
            )
            .classList.remove("oculto");

        };


      const url =
        URL_APPS_SCRIPT +
        "?codigo=" +
        encodeURIComponent(codigo) +
        "&servicio=" +
        encodeURIComponent(servicio) +
        "&callback=" +
        encodeURIComponent(callbackName);


      script =
        document.createElement(
          "script"
        );


      script.src = url;


      script.onerror =
        function() {

          if (respuestaRecibida) {
            return;
          }


          try {

            delete window[
              callbackName
            ];

          } catch (e) {

            window[
              callbackName
            ] = undefined;

          }


          if (
            script &&
            script.parentNode
          ) {

            script.parentNode
              .removeChild(script);

          }


          mostrarError(
            "No fue posible comunicarse con el sistema."
          );

        };


      document.body.appendChild(
        script
      );

    }


    /************************************************************
     * MOSTRAR RESULTADO
     ************************************************************/

    function mostrarResultado(
      respuesta
    ) {

      const resultado =
        document.getElementById(
          "resultado"
        );


      resultado.style.display =
        "block";


      /*
       * Primero quitamos cualquier color anterior.
       */

      resultado.className =
        "resultado";


      const titulo =
        document.getElementById(
          "resultadoTitulo"
        );


      const nombre =
        document.getElementById(
          "resultadoNombre"
        );


      const servicio =
        document.getElementById(
          "resultadoServicio"
        );


      const fecha =
        document.getElementById(
          "resultadoFecha"
        );


      const hora =
        document.getElementById(
          "resultadoHora"
        );


      servicio.innerHTML = "";
      fecha.innerHTML = "";
      hora.innerHTML = "";


      /**********************************************************
       * NO BENEFICIARIO
       **********************************************************/

      if (
        respuesta &&
        respuesta.titulo ===
          "⚠️ NO BENEFICIARIO PAE"
      ) {

        resultado.classList.add(
          "resultado-no-beneficiario"
        );


        titulo.textContent =
          "⚠️ NO BENEFICIARIO PAE";


        nombre.textContent =
          respuesta.mensaje || "";


        return;
      }


      /**********************************************************
       * ERROR
       **********************************************************/

      if (
        !respuesta ||
        (
          respuesta.ok === false &&
          !respuesta.duplicado
        )
      ) {

        resultado.classList.add(
          "resultado-error"
        );


        titulo.textContent =
          respuesta &&
          respuesta.titulo
            ? respuesta.titulo
            : "❌ ERROR";


        nombre.textContent =
          respuesta &&
          respuesta.mensaje
            ? respuesta.mensaje
            : "No fue posible registrar.";


        return;
      }


      /**********************************************************
       * DUPLICADO
       **********************************************************/

      if (
        respuesta.duplicado === true
      ) {

        resultado.classList.add(
          "resultado-duplicado"
        );


        titulo.textContent =
          "⚠️ ESTUDIANTE YA REGISTRADO";


        nombre.textContent =
          respuesta.estudiante ||
          respuesta.mensaje ||
          "";


        servicio.innerHTML =
          "<strong>Servicio:</strong> " +
          escaparHtml(
            respuesta.servicio || ""
          );


        fecha.innerHTML =
          "<strong>Fecha:</strong> " +
          escaparHtml(
            respuesta.fecha || ""
          );


        hora.innerHTML =
          "<strong>Hora del registro:</strong> " +
          escaparHtml(
            respuesta.hora || ""
          );


        return;
      }


      /**********************************************************
       * REGISTRO CORRECTO
       **********************************************************/

      resultado.classList.add(
        "resultado-exito"
      );


      titulo.textContent =
        "✅ ESTUDIANTE REGISTRADO";


      nombre.textContent =
        respuesta.estudiante ||
        respuesta.mensaje ||
        "";


      servicio.innerHTML =
        "<strong>Servicio:</strong> " +
        escaparHtml(
          respuesta.servicio || ""
        );


      fecha.innerHTML =
        "<strong>Fecha:</strong> " +
        escaparHtml(
          respuesta.fecha || ""
        );


      hora.innerHTML =
        "<strong>Hora:</strong> " +
        escaparHtml(
          respuesta.hora || ""
        );

    }


    /************************************************************
     * ERROR
     ************************************************************/

    function mostrarError(
      mensaje
    ) {

      respuestaRecibida =
        false;


      const resultado =
        document.getElementById(
          "resultado"
        );


      resultado.className =
        "resultado resultado-error";


      resultado.style.display =
        "block";


      document
        .getElementById(
          "resultadoTitulo"
        )
        .textContent =
          "❌ ERROR";


      document
        .getElementById(
          "resultadoNombre"
        )
        .textContent =
          mensaje;


      document
        .getElementById(
          "resultadoServicio"
        )
        .innerHTML = "";


      document
        .getElementById(
          "resultadoFecha"
        )
        .innerHTML = "";


      document
        .getElementById(
          "resultadoHora"
        )
        .innerHTML = "";


      document
        .getElementById(
          "btnSiguiente"
        )
        .classList.remove("oculto");

    }


    /************************************************************
     * SIGUIENTE
     ************************************************************/

    function siguiente() {

      if (
        !respuestaRecibida
      ) {

        console.log(
          "SIGUIENTE bloqueado: todavía esperando respuesta."
        );

        return;
      }


      document
        .getElementById(
          "resultado"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "bloqueServicio"
        )
        .classList.remove(
          "oculto"
        );


      document
        .getElementById(
          "lector"
        )
        .classList.remove(
          "oculto"
        );


      document
        .getElementById(
          "estado"
        )
        .textContent =
          "Iniciando cámara...";


      procesando = false;

      respuestaRecibida = false;


      setTimeout(
        function() {

          iniciarEscaner();

        },
        300
      );

    }


    /************************************************************
     * ESCAPAR HTML
     ************************************************************/

    function escaparHtml(
      texto
    ) {

      return String(
        texto || ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /************************************************************
     * INICIO
     ************************************************************/

    window.addEventListener(
      "load",
      function() {

        iniciarEscaner();

      }
    );

  </script>

</body>

</html>
